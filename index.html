        }

            margin: 25px 0;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }
        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 4px;
            background-color: white;
        }
        select:focus {
            outline: none;
            border-color: #0066cc;
        }

            padding: 25px;
            background-color: #f0f8ff;
            border-left: 4px solid #0066cc;
            border-radius: 4px;
            display: none;

            color: #0066cc;
            font-size: 20px;
        }
        .results h3 {
            color: #0066cc;

            margin-bottom: 10px;

            padding-left: 25px;

            margin: 12px 0;
            line-height: 1.8;

        .sub-list {
            margin-top: 8px;
            margin-left: 20px;
        }
        .notice {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
            color: #856404;

                <option value="belowneg25k">&lt; -$25k</option>

        function showResults() {
            const thirdParty = document.getElementById('thirdParty').value;
            const clipLevel = document.getElementById('clipLevel').value;
            const resultsDiv = document.getElementById('results');
            const contentDiv = document.getElementById('content');
            if (thirdParty && clipLevel) {
                const data = documentRequirements[thirdParty][clipLevel];
                let html = '';
                if (data.notice) {
                    html += `<div class="notice">${data.notice}</div>`;
                } else {
                    if (data.documents && data.documents.length > 0) {
                        html += '<h2>Required Documents:</h2><ol>';
                        data.documents.forEach(doc => {
                            html += `<li>${doc}</li>`;
                        });
                        html += '</ol>';
                    }
                    if (data.steps && data.steps.length > 0) {
                        html += '<h3>Step by Step:</h3><ol>';
                        data.steps.forEach(step => {
                            html += `<li>${step}</li>`;
                        });
                        html += '</ol>';
                    }
                }
                contentDiv.innerHTML = html;
                resultsDiv.classList.add('show');
            } else {
                resultsDiv.classList.remove('show');
            }
        }
